<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>무능한 날씨예측기</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f4f2; color: #222; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #555; font-size: 15px; line-height: 1.5; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: #1f5fa6; color: #fff; font-size: 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷에 연결되지 않았어요</h1>
      <p>날씨를 받아오려면 인터넷이 필요해요.<br />연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.href='https://doyeonkr.github.io/Weather-forecasting/'">다시 시도</button>
    </main>
  </body>
</html>
